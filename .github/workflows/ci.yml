name: GreenDay Banking Core CI

on:
  push:
    branches: [ main, bank-grade-ledger-twofish ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          GREENDAY_VAULT_PASSPHRASE: ci-vault-passphrase-not-for-production
          GREENDAY_VAULT_KEY_REFERENCE: ci-local-key
        run: mvn -B test
